services:
  - type: web
    name: badri-crud-backend
    runtime: node
    plan: free
    rootDir: mern-crud-app-main/backend
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: badri-crud-frontend
    runtime: static
    rootDir: mern-crud-app-main/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html